# .github/workflows/pages.yml - GitHub Pages deployment per suggestion 9
# GitHub Pages preview does not provide COOP/COEP headers.
name: Pages
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build PWA
        run: |
          python3 tools/fetch_vm_assets.py
          python3 tools/pack.py --tier base --target pwa
          ls -lh build/pwa/
          cat build/manifest-base.json | head -20
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "build/pwa"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
