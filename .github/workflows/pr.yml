# Tests the implemented preview, not the planned native kernel/rootfs builds.
name: PR
on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  preview:
    name: Buildroot preview and backend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch and verify pinned VM assets
        run: python3 tools/fetch_vm_assets.py
      - name: Build the shipped PWA
        run: python3 tools/pack.py --tier base --target pwa
      - name: Test backend and packaging
        run: |
          python3 -m unittest discover -s tests -q
          python3 -m unittest tools.test.test_preview_regressions -v
      - name: Install browser test tools
        run: |
          npm install --global @playwright/cli@0.1.22
          playwright-cli install-browser chromium --with-deps
      - name: Test browser workflows
        run: tools/test/run_browser_checks.sh
